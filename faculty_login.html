<!DOCTYPE html>
<html>

<head>

    <title>Faculty Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="login_container">

        <h1>Faculty Login</h1>

        <form id="facultyLoginForm">

            <label for="faculty_username">
                Username:
            </label>

            <input
                type="text"
                id="faculty_username"
                placeholder="Enter username"
            >

            <label for="faculty_password">
                Password:
            </label>

            <input
                type="password"
                id="faculty_password"
                placeholder="Enter password"
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

    <script src="js/script.js" defer></script>

</body>

</html>
