    <h1>Upload Notes / PYQ</h1>

    <div id="contribution">

    <h2>Add Notes</h2>


    <label for="notes_department">Department</label>

    <select id="notes_department">
        <option value="">Select Department</option>
        <option value="CSE">CSE</option>
        <option value="CE">CE</option>
        <option value="IT">IT</option>
    </select>


    <label for="notes_semester">Semester</label>

    <select id="notes_semester">
        <option value="">Select Semester</option>
        <option value="Sem 1">Sem 1</option>
        <option value="Sem 3">Sem 3</option>
        <option value="Sem 5">Sem 5</option>
        <option value="Sem 7">Sem 7</option>
    </select>


    <label for="notes_subject">Subject</label>

    <select id="notes_subject">
        <option value="">Select Subject</option>
    </select>


    <label for="notes_name">Notes Name</label>

    <input type="text"
           id="notes_name"
           placeholder="Enter notes name">

<label for="notes_type">Resource Type</label>

<select id="notes_type">
    <option value="">Select Type</option>
    <option value="Notes">Notes</option>
    <option value="PYQ">PYQ</option>
</select>
    <label for="notes_file">Select File</label>

    <input type="file" id="notes_file">


    <button type="button" id="add_notes">
        Add Notes
    </button>

</div>

    <footer>
        <div>Learn. Grow. Achieve.</div>
